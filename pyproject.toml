[project]
name = "zz-demand-system"
version = "0.1.0"
description = "Enterprise RAG Knowledge Base System"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.12",
    "httpx>=0.27.0",
    "streamlit>=1.40.0",
    "langchain>=1.3.0,<2.0.0",
    "langchain-community>=0.4.0",
    "langchain-openai>=1.4.0",
    "langchain-chroma>=0.2.0",
    "chromadb>=0.5.20,<0.6.0",
    "pypdf>=5.0.0",
    "python-docx>=1.1.0",
    "python-dotenv>=1.0.0",
    "docx2txt>=0.9",
    "rank-bm25>=0.2.0",
    "jieba>=0.42.1",
    "psycopg2-binary>=2.9.0",
    "gunicorn>=22.0.0",
    "celery>=5.4.0",
    "redis>=5.0.0",
    "slowapi>=0.1.9",
    "langchain-classic>=1.0.8",
]

[project.optional-dependencies]
postgres = ["asyncpg>=0.30.0"]
ollama = ["langchain-ollama>=0.2.0"]
langgraph = ["langgraph>=0.2.0"]
# bge-reranker 交叉编码器重排所需（默认 RAG_RERANK_ENABLED=false，不强制安装，
# 单独装在服务器上往往因 torch/tokenizers 需本地编译而失败）
rerank = ["transformers>=4.45.0", "torch>=2.0.0"]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.24.0", "ruff>=0.6.0", "mypy>=1.11.0"]

[tool.ruff]
line-length = 100
target-version = "py311"

[[tool.uv.index]]
name = "aliyun"
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true
